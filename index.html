<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Digital - Speed Motos Consomax</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top right, #1a1a1a, #0d0d0d, #000000);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }
    .tv-container {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 3vh 2.5vw;
      gap: 2.5vw;
    }

    /* Coluna de Mídia */
    .media-section {
      flex: 0 0 35%;
      height: 100%;
      background: #000000;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 2px solid rgba(239, 68, 68, 0.45);
    }
    
    #player, #image-display {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 5;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #dc2626, #ef4444, #f87171);
      transition: width 0.1s linear;
    }

    /* Coluna Informativa */
    .info-section {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 26px;
      padding: 3.5vh 3vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Cabeçalho */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      padding-bottom: 2vh;
      border-bottom: 1px solid rgba(239, 68, 68, 0.2);
    }
    .header-text {
      flex: 1;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #b91c1c, #ef4444);
      color: #ffffff;
      font-size: clamp(0.75rem, 1vw, 1.05rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 18px;
      border-radius: 50px;
      margin-bottom: 1vh;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }
    .header h1 {
      font-size: clamp(1.4rem, 2.2vw, 2.6rem);
      font-weight: 900;
      line-height: 1.2;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .header h1 span {
      color: #ef4444;
    }

    .logo-img {
      height: clamp(85px, 14vh, 140px);
      max-width: 260px;
      object-fit: contain;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.8));
    }

    /* Área de Legenda */
    
    
      
    video, #image-player {
      background: #000 !important;
      background-color: #000 !important;
    }
      .header-text h1, .header h1 {
      text-transform: uppercase !important;
}
      /* Motor TV Standard 2026 */
    .header-text h1, .header h1 {
      text-transform: uppercase !important;
    }
    .header-text h1 span, .header h1 span {
      text-transform: uppercase !important;
    }
    .info-section {
      height: 100vh !important;
      max-height: 100vh !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
    }
    .caption-container {
      flex: 1 1 auto !important;
      height: 0 !important;
      margin-top: 2rem !important;
      overflow-y: scroll !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
      position: relative !important;
    }
    .caption-container::-webkit-scrollbar {
      display: none !important;
    }
    .caption-box {
      font-size: 2.7vw !important;
      line-height: 1.4 !important;
      font-weight: 600 !important;
      color: #222 !important;
      word-wrap: break-word !important;
      white-space: pre-line !important;
      padding-bottom: 6rem !important;
    }
    video, #image-player {
      background: #000 !important;
      background-color: #000 !important;
    }
  </style>
</head>
<body>

  <div class="tv-container">
    <!-- Coluna de Mídia -->
    <div class="media-section">
      <img id="image-player" style="display:none; width:100%; height:100%; object-fit:contain; background-color:#050505;" /><video id="player" autoplay playsinline muted loop preload="auto" style="width:100%; height:100%; object-fit:contain; background-color:#050505;"><source id="video-source" src="" type="video/mp4"></video>
      <img id="image-display" alt="Foto do Post" style="display: none;" onerror="this.style.display='none'">
      
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress"></div>
      </div>
    </div>

    <!-- Coluna Informativa -->
    <div class="info-section">
      <div class="header">
        <div class="header-text">
          <span class="badge">O melhor negócio está aqui</span>
          <h1>Speed Motos <span>Consomax</span></h1>
        </div>
        <img src="logo.png" alt="Logo Speed Motos Consomax" class="logo-img" onerror="this.style.display='none'">
      </div>

      <div class="caption-container" id="caption-container">
        <div class="caption-box" id="caption-text">
          Carregando informações...
        </div>
      </div>
    </div>
  </div>

      <script>
    function iniciarAutoScroll(container) {
      if (!container) return;
      if (window.__scrollInterval) clearInterval(window.__scrollInterval);
      if (window.__scrollTimer) clearTimeout(window.__scrollTimer);

      container.scrollTop = 0;

      window.__scrollTimer = setTimeout(function() {
        var diferenca = container.scrollHeight - container.clientHeight;
        if (diferenca > 15) {
          var descendo = true;
          var pausado = false;

          window.__scrollInterval = setInterval(function() {
            if (pausado) return;

            if (descendo) {
              container.scrollTop += 1;
              if (container.scrollTop >= diferenca) {
                pausado = true;
                setTimeout(function() {
                  descendo = false;
                  pausado = false;
                }, 3000);
              }
            } else {
              container.scrollTop -= 3;
              if (container.scrollTop <= 0) {
                container.scrollTop = 0;
                descendo = true;
                pausado = true;
                setTimeout(function() {
                  pausado = false;
                }, 3500);
              }
            }
          }, 35);
        }
      }, 2500);
    }

    document.addEventListener('DOMContentLoaded', function() {
      var containerElem = document.getElementById('caption-container');
      var captionElem = document.getElementById('caption-text');
      var player = document.getElementById('player');
      var videoSource = document.getElementById('video-source');
      var imagePlayer = document.getElementById('image-player');

      var ts = new Date().getTime();

      fetch('data.json?v=' + ts)
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(posts) {
          if (!Array.isArray(posts) || posts.length === 0) {
            if (captionElem) captionElem.textContent = 'Nenhuma publicação encontrada.';
            return;
          }

          var urlParams = new URLSearchParams(window.location.search);
          var postParam = urlParams.get('post');
          var postIdx = parseInt(postParam, 10);

          var currentPost = posts[0];
          if (!isNaN(postIdx)) {
            var encontrado = posts.filter(function(p) {
              return p.id === postIdx || String(p.id) === String(postIdx);
            });
            currentPost = (encontrado.length > 0) ? encontrado[0] : (posts[postIdx - 1] || posts[0]);
          }

          var texto = currentPost.caption || currentPost.text || '';
          texto = texto.replace(/\n{3,}/g, '\n\n').trim();

          if (captionElem) {
            captionElem.textContent = texto;
            iniciarAutoScroll(containerElem);
          }

          var midiaArquivo = currentPost.media || currentPost.media_file || currentPost.video_file;
          var isFoto = currentPost.type === 'image' || (midiaArquivo && (midiaArquivo.indexOf('.jpg') !== -1 || midiaArquivo.indexOf('.png') !== -1));

          if (isFoto) {
            if (player) {
              player.pause();
              player.style.display = 'none';
            }
            if (imagePlayer) {
              imagePlayer.style.display = 'block';
              imagePlayer.src = midiaArquivo + '?v=' + ts;
            }
          } else {
            if (imagePlayer) imagePlayer.style.display = 'none';
            if (player && videoSource) {
              player.style.display = 'block';
              player.style.backgroundColor = '#000';
              player.loop = true;

              player.onended = function() {
                player.currentTime = 0;
                player.play().catch(function() {});
              };

              videoSource.src = midiaArquivo + '?v=' + ts;
              player.load();
              player.play().catch(function(e) { console.log('Autoplay:', e); });
            }
          }
        })
        .catch(function(err) {
          console.error('Erro ao carregar dados:', err);
          if (captionElem) captionElem.textContent = 'Erro ao carregar dados do mural.';
        });
    });
  </script>
</body>
</html>
